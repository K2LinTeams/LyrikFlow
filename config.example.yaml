# 配置示例
window:
  mode: overlay  # 运行模式: overlay 或 fullscreen

overlay:
  opacity: 0.85  # 悬浮窗背景透明度: 0.15 ~ 1.0
  x: -1          # 窗口 X 坐标，-1 为居中
  y: -1          # 窗口 Y 坐标
  w: 900         # 窗口宽度
  h: 130         # 窗口高度

font:
  size_current: 28  # 当前行歌词字号
  size_context: 14  # 译文与上下文行字号
  configs:          # 本地字体优先级与启用配置
    - family: "Zen Maru Gothic"
      enabled: true
    - family: "Comfortaa"
      enabled: true

lyrics:
  show_translation: true    # 是否显示双语翻译
  show_romaji: false        # 是否显示罗马音
  secondary_mode: prefer_trans  # 悬浮窗副行偏好
  show_line_progress: false  # 无逐字歌词时是否显示单句胶囊进度条
  offset_ms: 0              # 全局歌词同步时间微调偏移，毫秒
  parse_sections: true      # 是否开启段落与分段角色名解析

fullscreen:
  context_lines: 5          # 全画幅模式上下文阶梯显示行数: 1 ~ 8
  font_size_current: 38     # 全屏当前行歌词字号: 16 ~ 72
  font_size_context: 18     # 全屏上下文行字号: 10 ~ 48
  context_secondary_mode: both  # 全屏非当前行副行显示内容

smtc:
  watched_apps:             # 监听的音乐软件进程列表，留空为监听全部
    - cloudmusic.exe

theme:
  preset: "classic"         # 配色预设
  seed_color: "#0B57D0"
  colors:
    lyric_active: "#FFFFFF"
    lyric_inactive: "#A0A8B8"
    lyric_secondary: "#C3E1FF"
    progress_start: "#FFFFFF"
    progress_end: "#A0E6FF"
    accent: "#78CDFF"
